# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - "main"
      - "feat/plugins-verifier-marketplace-develop"
  pull_request:
    branches:
      - "main"
      - "feat/plugins-verifier-marketplace-develop"
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Build
        run: go build -v ./...
        env:
          CGO_ENABLED: 1
          CC: clang

      - name: Unit Tests
        run: make tests
        env:
          CGO_ENABLED: 1
          CC: clang

      - name: Linter
        run: make lint
        env:
          CGO_ENABLED: 1
          CC: clang

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23'

      - name: Install dependencies and run tests
        run: |
          cd plugins-ui
          npm install
          npm run test
      

