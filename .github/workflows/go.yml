name: CI

on:
  push:
    branches:
      - "main"
      - "feat/plugins-verifier-marketplace-develop"
  pull_request:
    branches:
      - "main"
      - "feat/plugins-verifier-marketplace-develop"
jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Build
        run: go build -v ./...
        env:
          CGO_ENABLED: 1
          CC: clang

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Unit Tests
        run: make tests
        env:
          CGO_ENABLED: 1
          CC: clang

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run Lint
        run: make lint

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23'

      - name: Install dependencies and run tests
        run: |
          cd plugins-ui
          npm install
          npm run test